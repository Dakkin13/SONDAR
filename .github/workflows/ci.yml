name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Fast, no external dependencies — runs on every push.
  typecheck-and-lint:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Golden-path Playwright tests: sign up → onboard, send a DM, create a
  # band. Runs against a throwaway LOCAL Supabase stack (Postgres + Auth +
  # Realtime + Storage, via Docker) that the Supabase CLI — already a
  # devDependency — spins up fresh from supabase/migrations/ and tears down
  # every run. No hosted "test project" and no repo secrets required; this
  # never touches sondar-e2e.test rows anywhere but this ephemeral runner.
  e2e:
    name: E2E (golden paths)
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # ubuntu-latest ships Docker pre-installed and running — no separate
      # setup action needed. This applies every file in supabase/migrations/
      # to a fresh local database as part of starting the stack.
      - name: Start local Supabase stack
        run: npx supabase start

      # `supabase status -o env` prints KEY="value" lines (API_URL, ANON_KEY,
      # SERVICE_ROLE_KEY, ...). Export them into this step's shell, then
      # re-emit under the names the app/tests actually read, into
      # GITHUB_ENV so later steps see them too. NEXT_PUBLIC_* vars must be
      # set before `npm run build` — they're inlined at build time, not
      # read at runtime.
      - name: Point the build at the local Supabase stack
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_WAITLIST_MODE=false"
          } >> "$GITHUB_ENV"

      - run: npm run build

      - name: Run golden-path E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
